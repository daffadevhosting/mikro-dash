<div class="row g-4 mb-4">
  <div class="col-md-3">
    <div class="card dashboard-card text-light">
      <div class="card-body d-flex align-items-center">
        <i class="bi bi-people-fill me-3 card-icon text-warning"></i>
        <div>
          <h5 class="card-title">Total Users</h5>
          <h3 id="total-users">...</h3>
        </div>
      </div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card dashboard-card text-light">
      <div class="card-body d-flex align-items-center">
        <i class="bi bi-wifi me-3 card-icon text-success"></i>
        <div>
          <h5 class="card-title">Online</h5>
          <h3 id="online-users" class="text-success">...</h3>
        </div>
      </div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card dashboard-card text-light">
      <div class="card-body d-flex align-items-center">
        <i class="bi bi-cash-stack me-3 card-icon text-info"></i>
        <div>
          <h5 class="card-title">Income Today</h5>
          <h3 id="income-today" class="text-info">Rp 0</h3>
        </div>
      </div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card dashboard-card text-light">
      <div class="card-body d-flex align-items-center">
        <i class="bi bi-calendar2-month me-3 card-icon text-primary"></i>
        <div>
          <h5 class="card-title">Income This Month</h5>
          <h3 id="income-month" class="text-primary">Rp 0</h3>
        </div>
      </div>
    </div>
  </div>
</div>

<script>

  function loadStatus() {
fetch('{{site.localurl}}/php/stats.php')
  .then(response => response.json())
  .then(data => {
    if (!data.error) {
      document.getElementById('total-users').textContent = data.totalUsers;
      document.getElementById('online-users').textContent = data.onlineUsers;
    } else {
      document.getElementById('total-users').textContent = 'Error';
      document.getElementById('online-users').textContent = 'Error';
    }
  })
  .catch(err => {
    document.getElementById('total-users').textContent = 'Error';
    document.getElementById('online-users').textContent = 'Error';
  })
 };

  function formatRupiah(value) {
    return 'Rp ' + Number(value || 0).toLocaleString('id-ID');
  }

  function loadIncome() {
    fetch('{{site.localurl}}/php/get_income.php')
      .then(response => response.json())
      .then(data => {
        document.getElementById('income-today').textContent = formatRupiah(data.today);
        document.getElementById('income-month').textContent = formatRupiah(data.month);
      })
      .catch(() => {
        document.getElementById('income-today').textContent = 'Error';
        document.getElementById('income-month').textContent = 'Error';
      });
  }

  setInterval(loadStatus, 5000); // Refresh setiap 5 detik
  setInterval(loadIncome, 30000);
  loadStatus();
  loadIncome();
</script>
